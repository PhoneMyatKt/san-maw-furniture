<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>စန်းမော် ပရိဘောဂ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Pyidaungsu:wght@400;700&display=swap');
        
        :root {
            --primary: #4338ca;
            --secondary: #6366f1;
            --accent: #f59e0b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', 'Pyidaungsu', sans-serif; 
            background: #f1f5f9; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        .hidden { display: none !important; }
        
        .glass-grad { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .input-style { 
            background: #ffffff; 
            border: 2px solid #f1f5f9; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .input-style:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .swipe-item {
            position: relative;
            overflow: hidden;
            border-radius: 1.5rem;
            margin-bottom: 0.85rem;
            background: #ef4444;
            transition: transform 0.2s ease;
        }

        .swipe-content {
            position: relative;
            z-index: 10;
            background: white;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 1.5rem;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .delete-btn-bg {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 5;
            font-size: 1.25rem;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-hover {
            transition: all 0.3s ease;
        }
        .btn-hover:active {
            transform: scale(0.96);
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Login Section -->
    <div id="login-section" class="fixed inset-0 z-[1000] bg-slate-950 flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-white rounded-[3rem] p-10 text-center shadow-2xl border border-slate-100">
            <div class="w-24 h-24 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-8 rotate-3 shadow-inner">
                <i class="fas fa-couch text-4xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">စန်းမော်</h2>
            <p class="text-slate-400 text-sm mt-2 mb-10 font-semibold tracking-wide uppercase">Furniture Admin</p>
            <div class="space-y-4 text-left">
                <div class="relative">
                    <i class="fas fa-user absolute left-5 top-5 text-slate-300"></i>
                    <input type="text" id="user-input" placeholder="User Name" class="w-full p-5 pl-14 input-style rounded-2xl outline-none font-bold text-slate-700">
                </div>
                <div class="relative">
                    <i class="fas fa-lock absolute left-5 top-5 text-slate-300"></i>
                    <input type="password" id="pass-input" placeholder="Password" class="w-full p-5 pl-14 input-style rounded-2xl outline-none font-bold text-slate-700">
                </div>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-5 rounded-2xl mt-6 shadow-xl btn-hover transition-all">
                    စနစ်ထဲသို့ ဝင်မည်
                </button>
            </div>
        </div>
    </div>

    <!-- Main App UI -->
    <div id="app-section" class="max-w-[480px] mx-auto px-5 pt-10 pb-24 hidden">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-md border border-slate-50 rotate-3">
                    <i class="fas fa-couch text-indigo-600 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">စန်းမော်</h1>
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-1">Cloud Sync Active</p>
                    </div>
                </div>
            </div>
            <button onclick="handleLogout()" class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-md text-rose-500 btn-hover">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </header>

        <!-- Dashboard -->
        <div class="glass-grad rounded-[2.5rem] p-8 text-white mb-10 relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex justify-between items-center mb-10">
                    <input type="date" id="date-filter" class="bg-white/10 border border-white/10 text-xs font-bold p-3 rounded-2xl outline-none text-white cursor-pointer hover:bg-white/20 transition-all">
                    <div class="text-[10px] font-black bg-emerald-500/20 text-emerald-300 px-3 py-1.5 rounded-full border border-emerald-500/30">LIVE DATA</div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-10">
                    <div class="stat-card p-5">
                        <p class="text-[10px] font-bold text-white/50 uppercase tracking-widest mb-1">ဝင်ငွေ</p>
                        <p id="inc-txt" class="text-2xl font-black">0</p>
                    </div>
                    <div class="stat-card p-5">
                        <p class="text-[10px] font-bold text-white/50 uppercase tracking-widest mb-1">သုံးငွေ</p>
                        <p id="exp-txt" class="text-2xl font-black">0</p>
                    </div>
                </div>
                <div class="pt-2">
                    <p class="text-[11px] font-bold text-white/40 uppercase tracking-[0.3em] mb-2">လက်ကျန်အမြတ်</p>
                    <div class="flex items-baseline gap-2">
                        <h2 id="profit-txt" class="text-5xl font-extrabold tracking-tighter">0</h2>
                        <span class="text-sm font-bold opacity-50">MMK</span>
                    </div>
                </div>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl"></div>
        </div>

        <!-- Add Form -->
        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 mb-10">
            <div class="space-y-5">
                <input type="text" id="desc-in" placeholder="အကြောင်းအရာ..." class="w-full p-5 input-style rounded-2xl outline-none font-bold text-sm">
                <div class="grid grid-cols-12 gap-3">
                    <div class="col-span-7">
                        <input type="number" id="amt-in" placeholder="ပမာဏ" class="w-full p-5 input-style rounded-2xl outline-none font-black text-2xl">
                    </div>
                    <div class="col-span-5">
                        <select id="type-in" class="w-full h-full input-style px-4 rounded-2xl font-extrabold text-xs text-indigo-600 outline-none appearance-none bg-slate-50">
                            <option value="income">ဝင်ငွေ (+)</option>
                            <option value="expense">သုံးငွေ (-)</option>
                        </select>
                    </div>
                </div>
                <button id="save-btn" class="w-full bg-slate-900 hover:bg-black text-white font-extrabold py-5 rounded-2xl shadow-xl btn-hover">သိမ်းဆည်းမည်</button>
            </div>
        </div>

        <div id="list-container" class="space-y-3"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config (Provided by environment)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : 'san-maw-final-v12';

        let records = [];
        let isAuth = false;

        window.handleLogin = () => {
            if(document.getElementById('user-input').value === 'admin' && document.getElementById('pass-input').value === 'admin') {
                localStorage.setItem('sm_logged_in_v12', 'true');
                initProcess();
            } else alert("Login မှားယွင်းနေပါသည်။");
        };

        window.handleLogout = async () => {
            if(confirm("Logout ထွက်ရန် သေချာပါသလား?")) {
                localStorage.removeItem('sm_logged_in_v12');
                await signOut(auth);
                location.reload();
            }
        };

        async function initProcess() {
            if(localStorage.getItem('sm_logged_in_v12') === 'true') {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user && localStorage.getItem('sm_logged_in_v12') === 'true') {
                isAuth = true;
                onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'records'), (snap) => {
                    records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderUI();
                });
            }
        });

        document.getElementById('save-btn').onclick = async () => {
            const desc = document.getElementById('desc-in').value;
            const amt = document.getElementById('amt-in').value;
            if(!desc || !amt || !isAuth) return;
            await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'records'), {
                desc, amt: parseFloat(amt), type: document.getElementById('type-in').value,
                date: document.getElementById('date-filter').value, createdAt: serverTimestamp()
            });
            document.getElementById('desc-in').value = ''; document.getElementById('amt-in').value = '';
        };

        window.deleteItem = async (id) => await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'records', id));

        let startX = 0;
        window.ts = (e) => startX = e.touches[0].clientX;
        window.tm = (e, id) => {
            let diff = startX - e.touches[0].clientX;
            if (diff > 0 && diff <= 100) document.getElementById(`content-${id}`).style.transform = `translateX(-${diff}px)`;
        };
        window.te = (e, id) => {
            let diff = startX - e.changedTouches[0].clientX;
            document.getElementById(`content-${id}`).style.transform = diff > 60 ? `translateX(-80px)` : `translateX(0px)`;
        };

        window.renderUI = () => {
            const date = document.getElementById('date-filter').value;
            const filtered = records.filter(r => r.date === date);
            const inc = filtered.filter(r => r.type === 'income').reduce((s,r) => s+r.amt, 0);
            const exp = filtered.filter(r => r.type === 'expense').reduce((s,r) => s+r.amt, 0);
            document.getElementById('inc-txt').innerText = inc.toLocaleString();
            document.getElementById('exp-txt').innerText = exp.toLocaleString();
            document.getElementById('profit-txt').innerText = (inc - exp).toLocaleString();

            document.getElementById('list-container').innerHTML = filtered.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).map(r => `
                <div class="swipe-item shadow-sm">
                    <div class="delete-btn-bg" onclick="deleteItem('${r.id}')"><i class="fas fa-trash-alt"></i></div>
                    <div id="content-${r.id}" class="swipe-content p-5 flex items-center justify-between" ontouchstart="ts(event)" ontouchmove="tm(event, '${r.id}')" ontouchend="te(event, '${r.id}')">
                        <div class="flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${r.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                                <i class="fas ${r.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'} text-sm"></i>
                            </div>
                            <div>
                                <p class="font-bold text-slate-800 tracking-tight">${r.desc}</p>
                                <p class="text-[9px] font-black uppercase tracking-[0.1em] mt-1 ${r.type === 'income' ? 'text-emerald-500' : 'text-rose-400'}">${r.type === 'income' ? 'ဝင်ငွေ' : 'သုံးငွေ'}</p>
                            </div>
                        </div>
                        <p class="font-black text-lg ${r.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">${r.amt.toLocaleString()}</p>
                    </div>
                </div>
            `).join('') || '<div class="py-16 text-center text-slate-300 font-bold italic opacity-60">မှတ်တမ်းမရှိသေးပါ။</div>';
        };

        document.getElementById('date-filter').value = new Date().toISOString().split('T')[0];
        document.getElementById('date-filter').onchange = renderUI;
        initProcess();
    </script>
</body>
</html>
