<!DOCTYPE html>

<html lang="my"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>စန်းမော် ပရိဘောဂ</title> <script src="https://www.google.com/search?q=https://cdn.tailwindcss.com"></script> <link href="[suspicious link removed]" rel="stylesheet"> <style> @import url('https://www.google.com/search?q=https://fonts.googleapis.com/css2%3Ffamily%3DPlus%2BJakarta%2BSans:wght%40400%3B600%3B700%3B800%26family%3DPyidaungsu:wght%40400%3B700%26display%3Dswap'); body { font-family: 'Plus Jakarta Sans', 'Pyidaungsu', sans-serif; background: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; } .hidden { display: none !important; } .glass-grad { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); } .input-style { background: #ffffff; border: 2px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); } .input-style:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); } .swipe-item { position: relative; overflow: hidden; border-radius: 1.5rem; margin-bottom: 0.85rem; background: #ef4444; } .swipe-content { position: relative; z-index: 10; background: white; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); border-radius: 1.5rem; border: 1px solid rgba(226, 232, 240, 0.8); } .delete-btn-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; display: flex; align-items: center; justify-content: center; color: white; z-index: 5; } .btn-hover:active { transform: scale(0.96); } </style> </head> <body class="min-h-screen"> <div id="login-section" class="fixed inset-0 z-[1000] bg-slate-950 flex items-center justify-center p-6"> <div class="w-full max-w-sm bg-white rounded-[3rem] p-10 text-center shadow-2xl"> <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6"> <i class="fas fa-couch text-3xl"></i> </div> <h2 class="text-3xl font-extrabold text-slate-900">စန်းမော်</h2> <p class="text-slate-400 text-xs mt-2 mb-10 font-semibold tracking-widest uppercase">Furniture Admin</p> <div class="space-y-4 text-left"> <input type="text" id="user-input" placeholder="အသုံးပြုသူအမည်" class="w-full p-5 input-style rounded-2xl outline-none font-bold"> <input type="password" id="pass-input" placeholder="လျှို့ဝှက်နံပါတ်" class="w-full p-5 input-style rounded-2xl outline-none font-bold"> <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white font-extrabold py-5 rounded-2xl mt-6 shadow-xl btn-hover">Login ဝင်မည်</button> </div> </div> </div> <div id="app-section" class="max-w-[480px] mx-auto px-5 pt-10 pb-24 hidden"> <header class="flex justify-between items-center mb-8"> <div class="flex items-center gap-4"> <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-md"> <i class="fas fa-couch text-indigo-600 text-xl"></i> </div> <h1 class="text-lg font-extrabold text-slate-900">စန်းမော်</h1> </div> <button onclick="handleLogout()" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-rose-500"><i class="fas fa-power-off"></i></button> </header> <div class="glass-grad rounded-[2.5rem] p-8 text-white mb-8 relative overflow-hidden"> <div class="relative z-10"> <div class="flex justify-between items-center mb-10"> <input type="date" id="date-filter" class="bg-white/10 border-none text-xs font-bold p-2.5 rounded-xl text-white"> <span class="text-[10px] font-black bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">ONLINE</span> </div> <div class="grid grid-cols-2 gap-6 mb-8"> <div><p class="text-[10px] font-bold opacity-50 uppercase mb-1">ဝင်ငွေ</p><p id="inc-txt" class="text-2xl font-black">0</p></div> <div><p class="text-[10px] font-bold opacity-50 uppercase mb-1">သုံးငွေ</p><p id="exp-txt" class="text-2xl font-black">0</p></div> </div> <div class="pt-2 border-t border-white/10"><p class="text-[10px] font-bold opacity-40 mb-1">အမြတ်</p><h2 id="profit-txt" class="text-4xl font-extrabold">0</h2></div> </div> </div> <div class="bg-white p-7 rounded-[2.5rem] shadow-sm border border-slate-100 mb-10"> <div class="space-y-4"> <input type="text" id="desc-in" placeholder="အကြောင်းအရာ..." class="w-full p-4 input-style rounded-2xl outline-none font-bold"> <div class="grid grid-cols-12 gap-2"> <input type="number" id="amt-in" placeholder="ပမာဏ" class="col-span-8 p-4 input-style rounded-2xl font-black text-xl"> <select id="type-in" class="col-span-4 input-style rounded-2xl font-bold text-xs text-indigo-600"><option value="income">ဝင်ငွေ</option><option value="expense">သုံးငွေ</option></select> </div> <button id="save-btn" class="w-full bg-slate-900 text-white font-extrabold py-5 rounded-2xl shadow-xl btn-hover">သိမ်းဆည်းမည်</button> </div> </div> <div id="list-container" class="space-y-3"></div> </div> <script type="module"> import { initializeApp } from "https://www.google.com/search?q=https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"; import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.google.com/search?q=https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"; import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.google.com/search?q=https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"; const firebaseConfig = JSON.parse(__firebase_config); const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app); const APP_ID = 'san-maw-furniture-live'; let records = []; window.handleLogin = () => { if(document.getElementById('user-input').value === 'admin' && document.getElementById('pass-input').value === 'admin') { localStorage.setItem('sm_auth', 'true'); checkAuth(); } else alert("Login မှားယွင်းနေပါသည်။"); }; window.handleLogout = async () => { if(confirm("ထွက်မှာသေချာလား?")) { localStorage.removeItem('sm_auth'); await signOut(auth); location.reload(); } }; async function checkAuth() { if(localStorage.getItem('sm_auth') === 'true') { document.getElementById('login-section').classList.add('hidden'); document.getElementById('app-section').classList.remove('hidden'); await signInAnonymously(auth); } } onAuthStateChanged(auth, (user) => { if (user && localStorage.getItem('sm_auth') === 'true') { onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'records'), (snap) => { records = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderUI(); }); } }); document.getElementById('save-btn').onclick = async () => { const desc = document.getElementById('desc-in').value, amt = document.getElementById('amt-in').value, type = document.getElementById('type-in').value, date = document.getElementById('date-filter').value; if(!desc || !amt) return; await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'records'), { desc, amt: parseFloat(amt), type, date, createdAt: serverTimestamp() }); document.getElementById('desc-in').value = ''; document.getElementById('amt-in').value = ''; }; window.deleteItem = async (id) => await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'records', id)); let startX = 0; window.ts = (e) => startX = e.touches[0].clientX; window.tm = (e, id) => { let diff = startX - e.touches[0].clientX; if (diff > 0 && diff <= 100) document.getElementById(content-${id}).style.transform = translateX(-${diff}px); }; window.te = (e, id) => { let diff = startX - e.changedTouches[0].clientX; document.getElementById(content-${id}).style.transform = diff > 60 ? translateX(-80px) : translateX(0px); }; function renderUI() { const date = document.getElementById('date-filter').value; const filtered = records.filter(r => r.date === date); const inc = filtered.filter(r => r.type === 'income').reduce((s,r) => s+r.amt, 0), exp = filtered.filter(r => r.type === 'expense').reduce((s,r) => s+r.amt, 0); document.getElementById('inc-txt').innerText = inc.toLocaleString(); document.getElementById('exp-txt').innerText = exp.toLocaleString(); document.getElementById('profit-txt').innerText = (inc - exp).toLocaleString(); document.getElementById('list-container').innerHTML = filtered.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).map(r => <div class="swipe-item shadow-sm"> <div class="delete-btn-bg" onclick="deleteItem('${r.id}')"><i class="fas fa-trash-alt"></i></div> <div id="content-${r.id}" class="swipe-content p-5 flex items-center justify-between" ontouchstart="ts(event)" ontouchmove="tm(event, '${r.id}')" ontouchend="te(event, '${r.id}')"> <div class="flex items-center gap-4"> <div class="w-10 h-10 rounded-xl flex items-center justify-center ${r.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}"><i class="fas ${r.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'} text-[10px]"></i></div> <div><p class="font-bold text-sm text-slate-800">${r.desc}</p><p class="text-[9px] font-bold text-slate-400 uppercase mt-1">${r.type === 'income' ? 'ဝင်ငွေ' : 'သုံးငွေ'}</p></div> </div> <p class="font-black ${r.type === 'income' ? 'text-emerald-600' : 'text-slate-700'}">${r.amt.toLocaleString()}</p> </div> </div>).join('') || '<div class="py-10 text-center text-slate-300 font-bold italic">မှတ်တမ်းမရှိပါ။</div>'; } document.getElementById('date-filter').value = new Date().toISOString().split('T')[0]; document.getElementById('date-filter').onchange = renderUI; checkAuth(); </script> </body> </html>
