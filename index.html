<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>စန်းမော် ပရိဘောဂ - စာရင်းချုပ်</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Pyidaungsu:wght@400;700&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', 'Pyidaungsu', sans-serif; 
            background: #f1f5f9; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }
        
        .premium-card { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        .input-field { 
            background: #ffffff; 
            border: 2px solid #e2e8f0; 
            transition: all 0.3s ease; 
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .record-item {
            background: white;
            border-radius: 1.25rem;
            margin-bottom: 0.5rem;
            border: 1px solid #f1f5f9;
        }

        .btn-active:active {
            transform: scale(0.97);
        }
        
        .modal-overlay {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        .nav-btn {
            background: white;
            border-radius: 1rem;
            padding: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }

        .nav-btn.active {
            color: #6366f1;
            background: #eff6ff;
        }

        .date-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #f1f5f9;
            padding: 1rem 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 z-[3000] modal-overlay flex items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm bg-white rounded-[2rem] p-8 shadow-2xl">
            <h3 class="text-xl font-black text-slate-900 mb-6">စာရင်းပြင်ဆင်ရန်</h3>
            <div class="space-y-4">
                <input type="text" id="edit-desc" placeholder="အကြောင်းအရာ..." class="w-full p-4 input-field rounded-2xl outline-none font-bold text-sm">
                <input type="number" id="edit-amt" placeholder="ပမာဏ" class="w-full p-4 input-field rounded-2xl outline-none font-black text-xl">
                <div class="flex gap-3 pt-2">
                    <button onclick="closeEditModal()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl btn-active">မလုပ်တော့ပါ</button>
                    <button id="save-edit-btn" class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-100 btn-active">ပြင်မည်</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="fixed inset-0 z-[2000] bg-slate-900 flex items-center justify-center p-6">
        <div class="w-full max-w-sm bg-white rounded-[2.5rem] p-10 text-center shadow-2xl">
            <div class="w-24 h-24 bg-indigo-50 text-indigo-600 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-inner">
                <i class="fas fa-couch text-4xl"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-900 tracking-tight mb-2">စန်းမော်</h2>
            <p class="text-indigo-600 font-bold text-sm mb-4">ပရိဘောဂ နှင့် အထွေထွေစာရင်းချုပ်</p>
            <button onclick="startApp()" class="w-full bg-indigo-600 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-200 btn-active transition-all text-lg flex items-center justify-center gap-3">
                စတင်အသုံးပြုမည် <i class="fas fa-arrow-right text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Main Wrapper -->
    <div id="main-app" class="max-w-[480px] mx-auto px-4 pt-8 pb-32 hidden">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 px-2">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                    <i class="fas fa-couch text-indigo-600 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-slate-900">စန်းမော်</h1>
                    <div class="flex items-center gap-1.5">
                        <span id="sync-dot" class="w-1.5 h-1.5 bg-slate-300 rounded-full"></span>
                        <p id="sync-status" class="text-[9px] font-bold text-slate-400 uppercase">Offline Mode</p>
                    </div>
                </div>
            </div>
            <button onclick="location.reload()" class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-slate-400 shadow-sm btn-active">
                <i class="fas fa-sync-alt text-sm"></i>
            </button>
        </header>

        <!-- Home Page View -->
        <div id="view-home">
            <!-- Stats Card -->
            <div class="premium-card rounded-[2.5rem] p-8 text-white mb-8 relative overflow-hidden shadow-2xl">
                <div class="relative z-10">
                    <div class="flex justify-between items-center mb-10">
                        <input type="date" id="main-date" class="bg-white/10 border-none text-[11px] font-bold p-2.5 rounded-xl text-white outline-none cursor-pointer">
                        <i class="fas fa-wallet opacity-30 text-xl"></i>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-10">
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                            <p class="text-[9px] font-bold text-emerald-400 uppercase mb-1">ဝင်ငွေ</p>
                            <p id="total-inc" class="text-xl font-black">0</p>
                        </div>
                        <div class="bg-white/5 p-4 rounded-2xl border border-white/10">
                            <p class="text-[9px] font-bold text-rose-400 uppercase mb-1">သုံးငွေ</p>
                            <p id="total-exp" class="text-xl font-black">0</p>
                        </div>
                    </div>

                    <div>
                        <p class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em] mb-1">ကျန်ရှိသည့် အမြတ်ငွေ</p>
                        <div class="flex items-baseline gap-2">
                            <h2 id="total-profit" class="text-4xl font-black tracking-tight">0</h2>
                            <span class="text-xs font-bold opacity-40">MMK</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Add Form -->
            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                <div class="space-y-4">
                    <input type="text" id="in-desc" placeholder="အကြောင်းအရာ..." class="w-full p-4 input-field rounded-2xl outline-none font-bold text-sm">
                    <div class="flex gap-2">
                        <input type="number" id="in-amt" placeholder="ပမာဏ" class="flex-1 p-4 input-field rounded-2xl outline-none font-black text-xl">
                        <select id="in-type" class="w-28 input-field rounded-2xl font-bold text-xs text-indigo-600 outline-none px-2">
                            <option value="income">ဝင်ငွေ (+)</option>
                            <option value="expense">သုံးငွေ (-)</option>
                        </select>
                    </div>
                    <button id="add-btn" class="w-full bg-slate-900 text-white font-black py-4 rounded-2xl shadow-xl hover:bg-black transition-all btn-active">
                        သိမ်းဆည်းမည်
                    </button>
                </div>
            </div>
        </div>

        <!-- Records Page View -->
        <div id="view-records" class="hidden">
            <h2 class="text-xl font-black text-slate-900 mb-6 flex items-center gap-3 px-2">
                <i class="fas fa-history text-indigo-600 text-sm"></i>
                စာရင်းမှတ်တမ်းချုပ်
            </h2>
            <div id="grouped-list" class="space-y-8"></div>
        </div>

        <!-- Bottom Navigation -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-full max-w-[400px] px-6 z-[2000]">
            <div class="bg-white/80 backdrop-blur-xl border border-white/20 p-3 rounded-[2rem] shadow-2xl flex justify-around items-center">
                <button onclick="switchView('home')" id="nav-home" class="nav-btn active flex-1 gap-2">
                    <i class="fas fa-home"></i>
                    <span class="text-[10px] font-black uppercase">Dashboard</span>
                </button>
                <div class="w-4"></div>
                <button onclick="switchView('records')" id="nav-records" class="nav-btn flex-1 gap-2">
                    <i class="fas fa-history"></i>
                    <span class="text-[10px] font-black uppercase">မှတ်တမ်း</span>
                </button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (will be provided at runtime)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'san-maw-grouped-v2';

        window.localData = JSON.parse(localStorage.getItem('sm_data_store') || '[]');
        let currentEditId = null;

        // Start Application
        window.startApp = () => {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            updateUI();
            
            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            initAuth();
        };

        // Firebase Auth State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('sync-dot').className = "w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse";
                document.getElementById('sync-status').innerText = "Live Cloud";
                
                // Real-time Firestore Listener
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'records'), (snap) => {
                    window.localData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    localStorage.setItem('sm_data_store', JSON.stringify(window.localData));
                    updateUI();
                });
            }
        });

        // View Switching Logic
        window.switchView = (view) => {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-records').classList.add('hidden');
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-records').classList.remove('active');

            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.getElementById(`nav-${view}`).classList.add('active');
            
            if(view === 'records') updateGroupedRecords();
        };

        // Add New Record (Always adds as new, even with same name)
        document.getElementById('add-btn').onclick = async () => {
            const desc = document.getElementById('in-desc').value;
            const amt = document.getElementById('in-amt').value;
            const type = document.getElementById('in-type').value;
            const date = document.getElementById('main-date').value;
            if(!desc || !amt) return;

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'records'), {
                    desc, amt: parseFloat(amt), type, date, createdAt: serverTimestamp()
                });
                document.getElementById('in-desc').value = '';
                document.getElementById('in-amt').value = '';
            } catch (e) {
                console.error("Error adding document: ", e);
            }
        };

        // Edit Functions
        window.openEditModal = (id) => {
            const record = window.localData.find(x => x.id === id);
            if(!record) return;
            currentEditId = id;
            document.getElementById('edit-desc').value = record.desc;
            document.getElementById('edit-amt').value = record.amt;
            document.getElementById('edit-modal').classList.remove('hidden');
        };

        window.closeEditModal = () => {
            document.getElementById('edit-modal').classList.add('hidden');
            currentEditId = null;
        };

        document.getElementById('save-edit-btn').onclick = async () => {
            if(!currentEditId) return;
            const newDesc = document.getElementById('edit-desc').value;
            const newAmt = parseFloat(document.getElementById('edit-amt').value);

            if(!newDesc || isNaN(newAmt)) return;

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', currentEditId);
                await updateDoc(docRef, { desc: newDesc, amt: newAmt });
                closeEditModal();
            } catch(e) {
                console.error("Error updating document: ", e);
            }
        };

        // UI Refresh
        function updateUI() {
            const selDate = document.getElementById('main-date').value;
            const filtered = window.localData.filter(x => x.date === selDate);
            
            const inc = filtered.filter(x => x.type === 'income').reduce((a, b) => a + b.amt, 0);
            const exp = filtered.filter(x => x.type === 'expense').reduce((a, b) => a + b.amt, 0);

            document.getElementById('total-inc').innerText = inc.toLocaleString();
            document.getElementById('total-exp').innerText = exp.toLocaleString();
            document.getElementById('total-profit').innerText = (inc - exp).toLocaleString();
            
            if (!document.getElementById('view-records').classList.contains('hidden')) {
                updateGroupedRecords();
            }
        }

        // History View with Date Grouping
        function updateGroupedRecords() {
            const groupedContainer = document.getElementById('grouped-list');
            
            const groups = window.localData.reduce((acc, item) => {
                if (!acc[item.date]) acc[item.date] = [];
                acc[item.date].push(item);
                return acc;
            }, {});

            const sortedDates = Object.keys(groups).sort((a, b) => new Date(b) - new Date(a));

            groupedContainer.innerHTML = sortedDates.map(date => {
                const records = groups[date].sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                
                const d = new Date(date);
                const dateDisplay = d.toLocaleDateString('my-MM', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                return `
                    <div class="space-y-2">
                        <div class="date-header">
                            <h3 class="text-[11px] font-black text-indigo-500 uppercase tracking-widest">${dateDisplay}</h3>
                        </div>
                        <div class="space-y-2 px-1">
                            ${records.map(item => `
                                <div class="record-item p-4 flex items-center justify-between">
                                    <div class="flex items-center gap-4">
                                        <div class="w-9 h-9 rounded-xl flex items-center justify-center ${item.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                                            <i class="fas ${item.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'} text-[9px]"></i>
                                        </div>
                                        <div>
                                            <p class="font-bold text-slate-800 text-xs leading-tight">${item.desc}</p>
                                            <p class="text-[8px] font-bold text-slate-400 uppercase mt-1">${item.type === 'income' ? 'ဝင်ငွေ' : 'သုံးငွေ'}</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <p class="font-black text-sm ${item.type === 'income' ? 'text-emerald-600' : 'text-slate-800'}">${item.amt.toLocaleString()}</p>
                                        <button onclick="openEditModal('${item.id}')" class="w-7 h-7 bg-slate-50 text-slate-300 rounded-lg flex items-center justify-center btn-active">
                                            <i class="fas fa-pen text-[9px]"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('') || '<div class="py-20 text-center text-slate-300 font-bold italic opacity-50">မှတ်တမ်းမရှိသေးပါ။</div>';
        }

        // Initialize Date
        document.getElementById('main-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('main-date').onchange = updateUI;
    </script>
</body>
</html>
